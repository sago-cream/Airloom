name: Homebrew
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Latest published stable release (vX.Y.Z)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: airloom-homebrew
  cancel-in-progress: false
jobs:
  update:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: macos-26
    timeout-minutes: 10
    environment: distribution
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify release assets and update the shared tap
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: python3 Scripts/homebrew.py update --tag "$RELEASE_TAG"
