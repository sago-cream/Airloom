name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag (vX.Y.Z)
        required: true
      resume_run_id:
        description: Previous release run with a pending notarization candidate
        required: false
      publish:
        description: Publish the verified draft release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: airloom-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      CODE_SIGN_IDENTITY: ${{ vars.APPLE_CODE_SIGN_IDENTITY }}
      APPLE_NOTARY_APPLE_ID: ${{ secrets.APPLE_NOTARY_APPLE_ID }}
      APPLE_NOTARY_PASSWORD: ${{ secrets.APPLE_NOTARY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1
        with:
          xcode-version: "26.6"
      - name: Validate tag and release state
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$(cat VERSION)" == "${RELEASE_TAG#v}" ]]
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" ]]
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]] || { echo "Dispatch from the release tag"; exit 1; }
          git fetch origin "refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse "FETCH_HEAD^{commit}")" == "$(git rev-parse HEAD)" ]] || { echo "Remote tag changed"; exit 1; }
          [[ "$GITHUB_SHA" == "$(git rev-parse HEAD)" ]] || { echo 'Dispatch this workflow from the release tag with --ref'; exit 1; }
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["isDraft"], "Public releases cannot be overwritten"' "$RUNNER_TEMP/release.json"
          fi
          if [[ -n "$RESUME_RUN_ID" ]]; then
            [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RESUME_RUN_ID" > "$RUNNER_TEMP/source-run.json"
            python3 - "$RUNNER_TEMP/source-run.json" <<'PY'
          import json, subprocess, sys
          run = json.load(open(sys.argv[1]))
          assert run['event'] == 'workflow_dispatch'
          assert run['path'].split('@')[0] == '.github/workflows/release.yml'
          assert run['head_sha'] == subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'Resume the same commit; dispatch the workflow from the release tag'
          PY
          fi
      - run: swift package resolve
      - name: Import signing material
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_CERTIFICATE_PASSWORD }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os, pathlib, secrets
          p = pathlib.Path(os.environ['RUNNER_TEMP'])
          (p / 'sparkle.key').write_text(os.environ['SPARKLE_PRIVATE_KEY'])
          (p / 'keychain-password').write_text(secrets.token_urlsafe(32))
          if not os.environ['RESUME_RUN_ID']:
              (p / 'developer-id.p12').write_bytes(base64.b64decode(os.environ['CERTIFICATE_BASE64'], validate=True))
          PY
          echo "SPARKLE_PRIVATE_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"
          if [[ -z "$RESUME_RUN_ID" ]]; then
            password="$(cat "$RUNNER_TEMP/keychain-password")"
            security create-keychain -p "$password" "$RUNNER_TEMP/signing.keychain-db"
            security set-keychain-settings -lut 3600 "$RUNNER_TEMP/signing.keychain-db"
            security unlock-keychain -p "$password" "$RUNNER_TEMP/signing.keychain-db"
            security import "$RUNNER_TEMP/developer-id.p12" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -k "$RUNNER_TEMP/signing.keychain-db"
            security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$RUNNER_TEMP/signing.keychain-db"
          fi
      - name: Restore original notarization candidate
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: notarization-candidate
          path: build/notarization
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Sign, notarize, staple, and verify
        id: package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          if [[ -n "$RESUME_RUN_ID" ]]; then
            Scripts/release.sh resume
          else
            Scripts/release.sh submit
          fi
      - name: Preserve the exact notarization candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notarization-candidate
          path: build/notarization/
          retention-days: 30
          if-no-files-found: ignore
      - name: Create draft and attach verified assets
        if: steps.package.outputs.assets != ''
        env:
          ASSETS: ${{ steps.package.outputs.assets }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Airloom ${RELEASE_TAG#v}"
          fi
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]
          [[ "$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}" | tail -1 | cut -f1)" == "$(git rev-parse HEAD)" ]]
          gh release upload "$RELEASE_TAG" "$ASSETS/Airloom-${RELEASE_TAG#v}.zip" "$ASSETS/appcast.xml" "$ASSETS/SHA256SUMS" --clobber
      - name: Publish verified release
        if: inputs.publish && steps.package.outputs.assets != ''
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
      - name: Report pending notarization
        if: steps.package.outputs.pending == 'true'
        run: |
          echo 'Apple is still processing. The exact candidate is saved for 30 days. Run this workflow from the same tag with resume_run_id set to this run ID.' >> "$GITHUB_STEP_SUMMARY"
          echo "Run ID: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          python3 - <<'PY'
          import os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ('sparkle.key', 'keychain-password', 'developer-id.p12'):
              (p / name).unlink(missing_ok=True)
          PY
